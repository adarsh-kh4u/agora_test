plugins {
    id 'com.android.application'
}

android {
    compileSdk 31

    defaultConfig {
        applicationId "com.silentkiller.servicecheckup"
        minSdk 23
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions "default"

    productFlavors {
        agoraFG {
            applicationId "com.silentkiller.servicecheckup"
            minSdkVersion 21
            targetSdkVersion 31
            versionCode 1
            versionName "1.0"
        }
        fg {
            applicationId "com.silentkiller.fg"
            minSdkVersion 21
            targetSdkVersion 31
            versionCode 1
            versionName "1.0"
        }
        agora {
            applicationId "com.silentkiller.agora"
            minSdkVersion 21
            targetSdkVersion 31
            versionCode 1
            versionName "1.0"
        }
    }

    sourceSets.agoraFG {
        java.srcDirs = ['src/agoraFG/java']
        res.srcDirs = ['res', 'src/agoraFG/res']
    }
    sourceSets.fg {
        java.srcDirs = ['src/fg/java']
        res.srcDirs = ['res', 'src/fg/res']
    }
    sourceSets.agora {
        java.srcDirs = ['src/agora/java']
        res.srcDirs = ['res', 'src/agora/res']
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation 'com.github.pwittchen:reactivenetwork-rx2:3.0.8'
    implementation 'com.github.agorabuilder:rtm-sdk:1.4.6'
}